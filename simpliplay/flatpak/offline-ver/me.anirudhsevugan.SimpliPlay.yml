app-id: me.anirudhsevugan.SimpliPlay
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --persist=simpliplay-snapshots
  - --device=dri

modules:
  - name: src
    buildsystem: simple
    build-commands:
      - |
        echo "cloned repo"
    sources:
      - type: git
        url: https://github.com/A-Star100/simpliplay-desktop.git
        branch: main
  - name: electron-zip
    buildsystem: simple
    build-commands:
      - |
        mkdir -p simpliplay/cache
        mv electron-zip-dl/*.zip simpliplay/cache/
    sources: 
      - type: file
        url: https://github.com/electron/electron/releases/download/v41.0.4/electron-v41.0.4-linux-x64.zip
        dest: electron-zip-dl
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/electron/electron/releases/download/v41.0.4/electron-v41.0.4-linux-arm64.zip
        dest: electron-zip-dl
        only-arches:
          - aarch64
  - name: build
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        - NODE_PATH: /usr/lib/sdk/node22/lib/node_modules
        - TAR_OPTIONS: "--no-same-owner --no-same-permissions --warning=no-unknown-keyword"
        - npm_config_offline: true
    build-commands:
      - |
        export root=$(pwd)
        cd simpliplay
        if [ "$FLATPAK_ARCH" = "x86_64" ]; then
          arch="x64"
        elif [ "$FLATPAK_ARCH" = "aarch64" ]; then
          arch="arm64"
        fi
        mv ./cache/*.zip $root/.electron-zip
        chmod -R +x simpliplay/node_modules/
        sed -i 's/"electron": "\^$electron"/"electron": "$electron"/g' simpliplay/package.json
        npx @electron/packager . SimpliPlay \
          --out=dist/ \
          --overwrite \
          --no-prune \
          --electron-zip-dir="$root/.electron-zip"
        mkdir -p /app/lib/SimpliPlay
        cp -r dist/SimpliPlay-linux-$arch/* /app/lib/SimpliPlay/
      # note: gotta double check the filepaths
      - install -Dm644 simpliplay/icon.png /app/share/icons/hicolor/512x512/apps/me.anirudhsevugan.SimpliPlay.png
      - install -Dm644 simpliplay/flatpak/me.anirudhsevugan.SimpliPlay.desktop /app/share/applications/me.anirudhsevugan.SimpliPlay.desktop
      #- install -Dm644 simpliplay/flatpak/me.anirudhsevugan.SimpliPlay.metainfo.xml /app/share/metainfo/me.anirudhsevugan.SimpliPlay.metainfo.xml
      - install -Dm755 run.sh /app/bin/run.sh

    sources:
      - type: script
        dest-filename: run.sh
        commands:
          - 'export WAYLAND_DISPLAY=""'
          - 'export XDG_SESSION_TYPE="x11"'
          - 'exec zypak-wrapper /app/lib/SimpliPlay/SimpliPlay --ozone-platform=x11 "$@"'
      - type: patch
        path: resolve-persistent-snapshot-path.patch
