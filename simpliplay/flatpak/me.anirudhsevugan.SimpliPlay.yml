app-id: me.anirudhsevugan.SimpliPlay
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --persist=simpliplay-snapshots
  - --device=dri

modules:
  - name: simpliplay
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/node22/bin
      env:
        - NODE_PATH: /usr/lib/sdk/node22/lib/node_modules
        - TAR_OPTIONS: "--no-same-owner --no-same-permissions --warning=no-unknown-keyword"
    build-commands:
      - |
        cd simpliplay
        npm install
        if [ "$FLATPAK_ARCH" = "x86_64" ]; then
          arch="x64"
        elif [ "$FLATPAK_ARCH" = "aarch64" ]; then
          arch="arm64"
        fi
        npx @electron/packager . SimpliPlay \
          --out=dist/ \
          --overwrite \
          --no-prune
        mkdir -p /app/lib/SimpliPlay
        cp -r dist/SimpliPlay-linux-$arch/* /app/lib/SimpliPlay/
      - install -Dm644 ./icon.png /app/share/icons/hicolor/512x512/apps/me.anirudhsevugan.SimpliPlay.png
      - install -Dm644 ./flatpak/me.anirudhsevugan.SimpliPlay.desktop /app/share/applications/me.anirudhsevugan.SimpliPlay.desktop
      # metainfo is dropped cuz it causes build failure on aarch64
      # due to the appstream cli's compose behaving very weirdly
      #- install -Dm644 simpliplay/flatpak/me.anirudhsevugan.SimpliPlay.metainfo.xml /app/share/metainfo/me.anirudhsevugan.SimpliPlay.metainfo.xml
      - install -Dm755 run.sh /app/bin/run.sh

    sources:
      - type: git
        url: https://github.com/A-Star100/simpliplay-desktop.git
        branch: main
      - type: script
        dest-filename: run.sh
        commands:
          - 'export WAYLAND_DISPLAY=""'
          - 'export XDG_SESSION_TYPE="x11"'
          - 'exec zypak-wrapper /app/lib/SimpliPlay/SimpliPlay --ozone-platform=x11 "$@"'
      - type: patch
        path: resolve-persistent-snapshot-path.patch
