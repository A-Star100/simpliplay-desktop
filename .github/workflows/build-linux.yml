name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/dependabot-bump.yml'
      - '.github/workflows/dependabot.yml'
      - 'README.md' #ignore readme
      - '.gitignore' #ignore the gitignore that is the file that ignores other files
  workflow_dispatch:
  workflow_call:

jobs:
  build_x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install
        working-directory: simpliplay

      - name: Build Snap and AppImage
        run: npx electron-builder --linux snap AppImage --x64
        working-directory: simpliplay

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flatpak flatpak-builder
        continue-on-error: true

      - name: Create unpacked build for Flatpak
        run: npx electron-builder --linux --x64 --dir
        working-directory: simpliplay
        
      - name: Patch package.json
        run: |
          # save OG package json
          cp simpliplay/package.json simpliplay/package.json.orig
          # Check if jq is installed; if not, install it
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          # patch the json to use select electron for compat
          jq '.devDependencies.electron="40.0.0" | .devDependencies["electron-builder"]="26.0.1"' \
              simpliplay/package.json.orig > simpliplay/package.flatpak.json
              
          # print the json to double check if jq actually worked...
          echo "electron $(jq -r '.devDependencies.electron' simpliplay/package.flatpak.json)"
          echo "electron-builder $(jq -r '.devDependencies["electron-builder"]' simpliplay/package.flatpak.json)"
          
          # replace package.json for flatpak build
          mv simpliplay/package.flatpak.json simpliplay/package.json

      - name: Build Flatpak
        run: npx electron-builder --linux flatpak --x64
        working-directory: simpliplay
        continue-on-error: true

      - name: Restore package.json
        run: mv simpliplay/package.json.orig simpliplay/package.json # redundant for now but might be useful in future

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-snap
          path: simpliplay/dist/*.snap

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-flatpak
          path: simpliplay/dist/*.flatpak
        continue-on-error: true

  build_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use arm64 package.json instead of x64
        run: |
          mv simpliplay/package.json simpliplay/package-unused.json
          mv simpliplay/package-arm64-linux.json simpliplay/package.json

      - run: npm install
        working-directory: simpliplay

      - run: npx electron-builder --linux AppImage --arm64
        working-directory: simpliplay

      # the below is to prevent snapcraft from crashing
      # for some reason it does not cope without these deps
      # on arm64 and armv7 anyway

      - name: Update package listings and install libgdk-pixbuf
        run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - name: Install Snapcraft CLI
        run: sudo snap install snapcraft --classic

      - name: Install GNOME packages
        run: sudo snap install gnome-3-28-1804

      - name: Install GTK theme stuff
        run: sudo snap install gtk-common-themes

      - name: Install core22 snap
        run: sudo snap install core22

      - name: Build Snap
        run: SNAPCRAFT_BUILD_ENVIRONMENT=host USE_SYSTEM_FPM=true npx electron-builder --linux snap --arm64
        working-directory: simpliplay

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flatpak flatpak-builder
        continue-on-error: true

      - name: Patch package.json for Flatpak
        run: |
          # Save og
          cp simpliplay/package.json simpliplay/package.json.orig
          # Check if jq is installed; if not, install it
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          # patch the json to use select electron and electron-builder for compat
          jq '.devDependencies.electron="40.0.0" | .devDependencies["electron-builder"]="26.0.1"' \
              simpliplay/package.json.orig > simpliplay/package.flatpak.json
              
          # print the json to double check if jq actually worked...
          echo "electron $(jq -r '.devDependencies.electron' simpliplay/package.flatpak.json)"
          echo "electron-builder $(jq -r '.devDependencies["electron-builder"]' simpliplay/package.flatpak.json)"
          
          # replace package.json for flatpak build cuz electron-builder is unfortunately
          # picky regarding flatpaks
          mv simpliplay/package.flatpak.json simpliplay/package.json

      - name: Create unpacked build for Flatpak
        run: npx electron-builder --linux --arm64 --dir
        working-directory: simpliplay

      - name: Build Flatpak
        run: | 
          #echo "file struct below:"
          #ls
          
          #if ! pwd | grep -q "simpliplay"; then
            #cd simpliplay
          #fi
          if [ ! -d node_modules ]; then
            echo "node_modules wasn't found, will install deps now"
            npm install
          fi
          npx electron-builder --linux flatpak --arm64
          
        working-directory: simpliplay
        continue-on-error: true

      - name: Restore package.json
        run: mv simpliplay/package.json.orig simpliplay/package.json

      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-snap
          path: simpliplay/dist/*.snap

      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-flatpak
          path: simpliplay/dist/*.flatpak
        continue-on-error: true

  build_i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
  
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare i386 package.json
        run: |
          # save og package.json
          cp simpliplay/package.json simpliplay/package.json.orig
      
          # is jq installed?
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      
          # patch package.json to use Electron v3.1
          jq '.devDependencies.electron="3.1.13"' simpliplay/package.json.orig > simpliplay/package.i386.json
      
          # replace package.json for the i386 build
          mv simpliplay/package.i386.json simpliplay/package.json
  
      - run: npm install
        working-directory: simpliplay
  
      - name: Build AppImage i386
        run: npx electron-builder --linux AppImage --ia32
        working-directory: simpliplay
  
      - uses: actions/upload-artifact@v6
        with:
          name: linux-i386-appimage
          path: simpliplay/dist/*.AppImage

  build_armv7:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
  
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      #TODO: remove qemu emulation step cuz
      #apparently snapcraft v8 has better platforms handling

      - name: Install QEMU for ARMv7 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          # register arm emulation to fool the snapcraft cli
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Build ARMv7 AppImage
        run: npx electron-builder --linux AppImage --armv7l
        working-directory: simpliplay
  
      - name: Upload ARMv7 AppImage
        uses: actions/upload-artifact@v6
        with:
           name: linux-armv7-appimage
           path: simpliplay/dist/*.AppImage

      # the below is to prevent snapcraft from crashing
      # for some reason it does not cope without these deps
      # on arm64 and armv7 anyway

      - name: Update package listings and install libgdk-pixbuf
        run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - name: Install Snapcraft CLI
        run: sudo snap install snapcraft --classic

      - name: Install GNOME packages
        run: sudo snap install gnome-3-28-1804

      - name: Install GTK theme stuff
        run: sudo snap install gtk-common-themes

      - name: Install core22 snap
        run: sudo snap install core22

      - name: Build snap
        run: npx electron-builder --linux snap --armv7l
        working-directory: simpliplay
        
      - name: Upload artifacts      
        uses: actions/upload-artifact@v6
        with:
          name: linux-armv7l-v2-snap
          path: simpliplay/dist/*.snap

  build_riscv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install global deps (qemu, jq, risc-v libs and ts-node)
        run: |
          sudo apt-get update
          # the libc6-riscv64-cross package gives us the dynamic loader and base libs
          # which will definitely help
          # we just have to hope the package doesn't get damaged in shipping though
          sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support libc6-riscv64-cross
          # qemu, please register at the front desk
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true
          # ts-node, have a good flight to here
          npm install -g ts-node typescript

      - name: Install Node project deps
        run: npm install
        working-directory: simpliplay

      - name: Swap to electron-builder fork and build
        env:
          npm_config_arch: riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu/
          ELECTRON_MIRROR: "https://github.com/riscv-forks/electron-riscv-releases/releases/download/"
          ELECTRON_CUSTOM_DIR: 'v${version}' # don't try and resolve the value
          # before the job starts
          # otherwise builder will use a broken url
          # which is very very bad
          ELECTRON_CUSTOM_FILENAME: 'electron-v${version}-linux-riscv64.zip'
          # same here as well
        run: |
          # install yarn globally
          # instead of using corepack
          # its not clean for CI but better than corepack
          npm install -g yarn
          
          # clone the repo
          echo "cloning electron-builder fork..."
          
          # clone specific branch using --branch flag
          # we target the known riscv release tag/branch
          git clone --branch electron-builder@25.1.8-riscv https://github.com/riscv-forks/electron-builder.git custom-builder
          
          # move into builder dir now
          cd custom-builder
          
          echo "now using branch:"
          git branch --show-current || git symbolic-ref --short HEAD
          
          # list branches
          echo "available branches:"
          git branch -a | head -n 10

          touch yarn.lock # now tell the yarn v4
          # that builder is what we're working with

          # just strip the whole packageManager key
          # we dont need any yarn vs. pnpm conflicts
          jq 'del(.packageManager)' package.json > package.json.tmp && mv package.json.tmp package.json
          rm -f pnpm-lock.yaml

          # make yarn use node-modules
          # so it doesnt strip symlinks
          echo "nodeLinker: node-modules" > .yarnrc.yml
          

          # use yarn v4
          # cuz it natively supports workspace protocol
          # that yarn v1 hates
          yarn set version berry

          # confirm yarn ver
          yarn --version

          
          # patch out dmg-license
          # it's darwin-only and freaks out linux compiler
          # causing a direct halt
          # hopefully this issue gets fixed with the fork soon
          # also we check if dmg-license is the only one there
          # and delete entire dependencies key if it is
          find . -name "package.json" -type f | while read -r file; do
            jq 'del(.dependencies["dmg-license"], .devDependencies["dmg-license"]) | 
                if .dependencies == {} then del(.dependencies) else . end | 
                if .devDependencies == {} then del(.devDependencies) else . end' \
                "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done

          # create symlinks manually
          # to resolve yarn errors after install inside the monorepo
          mkdir -p node_modules/@electron
          ln -sf "$(pwd)/packages/builder-util" "node_modules/@electron/builder-util"
          ln -sf "$(pwd)/packages/app-builder-lib" "node_modules/app-builder-lib"

          # install the builder's own deps inside custom-builder
          yarn install --no-immutable
          yarn add ts-node typescript --dev
          # not using --ignore-scripts anymore
          # cuz it breaks the cli when we run it
          # and it tries to find its deps
          # but the scripts were the ones that added them
          # and by skipping them it causes that error


          # old stuff below:
          # compile with npm instead of tsc
          # echo "compiling electron-builder source..."
          # try tsc build
          # npx tsc --skipLibCheck --noEmitOnError false || echo "tsc finished, checking for output..."
          # old stuff ended

          echo "yarn adding missing deps"
          cd packages/electron-builder

          sed -i 's/workspace:\*/\*/g' package.json # workspaces, nope
          
          touch yarn.lock # make a yarn lockfile here
          # so yarn v4 stops whining about usage issues

          # and now add the deps
          yarn add is-ci yargs@16.2.0 chalk@2.4.2 read-config-file ts-node typescript
          # oughta use older version of yargs
          # cuz newer ones deprecated yargs.parserConfiguration which is used in
          # electron-builder/src/builder.ts and is needed
          # otherwise build will crash and fail immediately
          # also have to use older version of chalk
          # for commonjs support
          # cuz for some reason v5+ uses ESM only and hates any mentions of commonjs
          # so this is the only choice for now
          cd ../..
          
          echo "setting up extra symlinks..."
          # for the internal imports
          # in electron builder module
          
          for pkg_path in packages/*; do
            if [ -d "$pkg_path" ]; then
              pkg_name=$(basename "$pkg_path")
              echo "creating symlinks for $pkg_name..."

              # create 'out' dir
              mkdir -p "$pkg_path/out"
              # symlink all the contents in src/ and out/
              # recursively

              # only if an 'src' dir exists
              # then make a symlink
              # otherwise cp'll be like "can not stat non existent dir bwha haha haha"
              # and thats irritating
              if [ -d "$pkg_path/src" ]; then
                mkdir -p "$pkg_path/out"
                # if src is empty and we use *, cp'll throw errors
                # because it expects at least one file inside
                # since the asterisk covers all files in current dir
                # but . just won't care, it only expects its parent dir to exist
                # and no contents have to be inside 
                cp -rsf "$(pwd)/$pkg_path/src/." "$(pwd)/$pkg_path/out/"
              fi

              # make package discoverable in node_modules properly
              # cuz some packages are namespaced right
              # and are discoverable by default due to their preferences
              # but others are not... unfortunately
              if [ "$pkg_name" == "builder-util" ]; then
                mkdir -p node_modules/@electron
                ln -sf "$(pwd)/$pkg_path" "node_modules/@electron/builder-util"
                ln -sf "$(pwd)/$pkg_path" "node_modules/builder-util"
              else
                ln -sf "$(pwd)/$pkg_path" "node_modules/$pkg_name"
              fi
            fi
          done


          # old attempts: not good
          # mkdir -p packages/electron-builder/out
          # ln -sfn "$(pwd)/packages/electron-builder/src" packages/electron-builder/out
          # mkdir -p packages/electron-builder/out/cli
          # # redirects .ts to use .js with a symlink
          # ln -sf "$(pwd)/packages/electron-builder/src/cli/cli.ts" "packages/electron-builder/out/cli/cli.js"

          # mkdir -p packages/app-builder-lib/out
          # ln -sfn "$(pwd)/packages/app-builder-lib/src" packages/app-builder-lib/out
          # mkdir -p packages/builder-util/out
          # ln -sfn "$(pwd)/packages/builder-util/src" packages/builder-util/out

          

          # stay inside builder dir
          echo "attempting build now..."
          
          # -r hooks ts-node into the whole proc
          # so ts-node is always there during the compile process
          # to catch any requests
          
          # export node_path so any siblings are found
          # properly, so no libs will whine during compile
          export NODE_PATH="$(pwd)/packages/electron-builder/node_modules:$(pwd)/packages"

          # the below is OLD
          # # super ultra quick
          # # last minute reinstall of chalk
          # # to prevent a new esm-only polluted version
          # # from infiltrating the build process
          # # which would be pretty annoying if it happened
          # # rm -rf node_modules/chalk
          # # cd packages/electron-builder
          # # yarn add chalk@2.4.2
          # # cd ../..
          # old stuff ended now

          # the code below is in case we migrate BACK to commonjs one day for some reason
          # or want to rely on ESM as less as possible
          # force-patch the chalk imports and require functions
          # to not use any .default stuff the old libs ain't compatible with
          # cuz in older deps the export is the func
          # but when ts-node compiles the instructs to commonjs
          # it is like "hey look for chalk.default"
          # which won't work obviously
          find packages/electron-builder/src -name "*.ts" -exec sed -i 's/import chalk from "chalk"/import * as chalk from "chalk"/g' {} +
          find packages/electron-builder/src -name "*.ts" -exec sed -i 's/require("chalk")/ (require("chalk").default || require("chalk"))/g' {} +

          
          # ts_node_transpile_only skips all the type checks
          # ts_node_compiler_options overrides the silly strict project configs
          # --skip-project forces ts-node to ignore
          unset NODE_OPTIONS # in case there's some weirdly broken options
          # the tsconfig.json because it is very problematic
          export TS_NODE_COMPILER_OPTIONS='{
            "module": "nodenext",
            "target": "esnext",
            "moduleResolution": "nodenext",
            "skipLibCheck": true,
            "esModuleInterop": true,
            "allowSyntheticDefaultImports": true,
            "experimentalResolver": true,
            "transpileOnly": true
          }'

          export NODE_OPTIONS="--loader ts-node/esm --no-warnings" # using this to run the TS files
          # with native ESM! 
          
          npx ts-node --esm \
            --transpile-only \
            --skip-project \
            "packages/electron-builder/src/cli/cli.ts" \
            --project "../../" \
            --linux appimage \
            --arch riscv64
        working-directory: simpliplay

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-riscv64-appimage
          path: simpliplay/dist/*.AppImage

