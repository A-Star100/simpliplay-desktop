name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install project deps
        run: npm install
        working-directory: simpliplay

      - name: Build Snap and AppImage
        run: npx electron-builder --linux snap AppImage --x64
        working-directory: simpliplay

      - name: Rename files
        run: mv dist/SimpliPlay-x86_64-linux.AppImage dist/SimpliPlay-x64-linux.AppImage
        working-directory: simpliplay

      - name: Install Flatpak deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flatpak flatpak-builder
          # setup flathub repo
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        #continue-on-error: true
        
      - name: Build Flatpak
        run: |
          # now build
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean build-dir flatpak/me.anirudhsevugan.SimpliPlay.yml
          flatpak build-export repo build-dir
          flatpak build-bundle repo SimpliPlay-x64-linux.flatpak me.anirudhsevugan.SimpliPlay
          mv *.flatpak dist/
        working-directory: simpliplay
        #continue-on-error: true

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-snap
          path: simpliplay/dist/*.snap

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-flatpak
          path: simpliplay/dist/*.flatpak
        continue-on-error: true

  build_arm64:
    runs-on: ubuntu-24.04-arm # cuz now electron-builder has core24 support
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use arm64 package.json instead of x64
        run: |
          mv simpliplay/package.json simpliplay/package-unused.json
          mv simpliplay/package-arm64-linux.json simpliplay/package.json

      - name: Install project deps
        run: npm install
        working-directory: simpliplay

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --arm64
        working-directory: simpliplay

      # the below deps are installed
      # because for arm64, the snapcraft build
      # environment is set to host; so build uses system deps

      - name: Update package listings and install libgdk-pixbuf
        run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - name: Install Snapcraft CLI
        run: sudo snap install snapcraft --classic --channel=8.x/stable

      - name: Install GNOME packages
        run: sudo snap install gnome-3-28-1804

      - name: Install GTK theme snap
        run: sudo snap install gtk-common-themes

      - name: Install core24 snap
        run: sudo snap install core24

      - name: Build Snap
        run: SNAPCRAFT_BUILD_ENVIRONMENT=host USE_SYSTEM_FPM=true npx electron-builder --linux snap --arm64
        working-directory: simpliplay
        #continue-on-error: true
      - name: Install Flatpak deps
        run: |
          timeout 80s sudo add-apt-repository ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y build-essential flatpak flatpak-builder
          sudo apt-get install appstream appstream-compose appstream-util
          # setup flathub repo
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak
        run: |
          # now build
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean build-dir flatpak/me.anirudhsevugan.SimpliPlay.yml
          flatpak build-export repo build-dir
          flatpak build-bundle repo SimpliPlay-arm64-linux.flatpak me.anirudhsevugan.SimpliPlay
          mv *.flatpak dist/
        working-directory: simpliplay
        #continue-on-error: true

      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-snap
          path: simpliplay/dist/*.snap

      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-flatpak
          path: simpliplay/dist/*.flatpak

  build_armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
  
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # qemu isn't needed
      # cuz when building prebuilt
      # electron binaries are already installed
      # so there is literally no reason
      # to use qemu anymore
      # and also npx electron builder forces armv7 snap builds
      # and just to double check the file header's correct for armv7
      # so neat

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --armv7l
        working-directory: simpliplay

      # the below is to prevent snapcraft from crashing
      # for some reason it does not cope without these deps
      # on arm64 and armv7 anyway

      - name: Update package listings and install libgdk-pixbuf
        run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - name: Install Snapcraft CLI
        run: sudo snap install snapcraft --classic

      - name: Install GNOME packages
        run: sudo snap install gnome-3-28-1804

      - name: Install GTK theme stuff
        run: sudo snap install gtk-common-themes

      - name: Install core22 snap
        run: sudo snap install core22

      - name: Build snap
        run: npx electron-builder --linux snap --armv7l
        working-directory: simpliplay
        
      - uses: actions/upload-artifact@v6
        with:
          name: linux-armv7l-v2-snap
          path: simpliplay/dist/*.snap

      - uses: actions/upload-artifact@v6
        with:
           name: linux-armv7-appimage
           path: simpliplay/dist/*.AppImage

      # - uses: actions/upload-artifact@v6
      #   with:
      #      name: linux-armv7-flatpak
      #      path: simpliplay/dist/*.flatpak

