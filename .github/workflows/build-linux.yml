  build_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use ARM64 package.json
        run: |
          mv simpliplay/package.json simpliplay/package-unused.json
          mv simpliplay/package-arm64-linux.json simpliplay/package.json

      - run: npm install
        working-directory: simpliplay

      #- name: Install Flatpak tooling
        #run: |
          #sudo apt-get update
          #sudo apt-get install -y flatpak flatpak-builder
        #continue-on-error: true

      - run: npx electron-builder --linux AppImage --arm64
        working-directory: simpliplay

      #- name: Prepare Flatpak package.json
        #run: |
          ## Save original
          #cp simpliplay/package.json simpliplay/package.json.orig
          ## Check if jq is installed; if not, install it
          #if ! command -v jq &> /dev/null
          #then
            #echo "jq not found, installing..."
            #sudo apt-get update
            #sudo apt-get install -y jq
          #fi
          ## Create patched package.json with older Electron
          #jq '.devDependencies.electron="39.0.0"' simpliplay/package.json.orig > simpliplay/package.flatpak.json
          ## Replace package.json for Flatpak build
          #mv simpliplay/package.flatpak.json simpliplay/package.json

      #- name: Create unpacked build for Flatpak
        #run: npx electron-builder --linux --arm64 --dir
        #working-directory: simpliplay

      #- name: Build Flatpak
        #run: npx electron-builder --linux flatpak --arm64
        #working-directory: simpliplay
        #continue-on-error: true

      #- name: Restore original package.json
        #run: mv simpliplay/package.json.orig simpliplay/package.json

      - run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - run: sudo snap install snapcraft --classic

      - run: sudo snap install gnome-3-28-1804

      - run: sudo snap install gtk-common-themes

      - run: sudo snap install core22

      - run: SNAPCRAFT_BUILD_ENVIRONMENT=host USE_SYSTEM_FPM=true npx electron-builder --linux snap --arm64
        working-directory: simpliplay

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-snap
          path: simpliplay/dist/*.snap

      #- uses: actions/upload-artifact@v4
        #with:
          #name: linux-arm64-flatpak
          #path: simpliplay/dist/*.flatpak
        #continue-on-error: true

  build_i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare i386 package.json
        run: |
          # Save original
          cp simpliplay/package.json simpliplay/package.json.orig
      
          # Check if jq is installed; install if missing
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      
          # Patch package.json to use Electron v3.1
          jq '.devDependencies.electron="3.1.13"' simpliplay/package.json.orig > simpliplay/package.i386.json
      
          # Replace package.json for the i386 build
          mv simpliplay/package.i386.json simpliplay/package.json
  
      - run: npm install
        working-directory: simpliplay
  
      - name: Build AppImage i386
        run: npx electron-builder --linux AppImage --ia32
        working-directory: simpliplay
  
      - uses: actions/upload-artifact@v4
        with:
          name: linux-i386-appimage
          path: simpliplay/dist/*.AppImage

build_armv7:
  runs-on: ubuntu-22.04-arm
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install electron-builder dependencies
      run: npm install
      working-directory: simpliplay

    - run: sudo snap install snapcraft --classic

    - name: Build ARMv7 AppImage
      run: npx electron-builder --linux AppImage --armv7l
      working-directory: simpliplay
      continue-on-error: true

    - name: Upload ARMv7 AppImage
      uses: actions/upload-artifact@v4
      with:
        name: linux-armv7-appimage
        path: simpliplay/dist/*.AppImage
      continue-on-error: true

    - name: Prepare Snap wrapper folder
      run: |
        mkdir -p snap/parts/appimage-wrapper
        cp simpliplay/dist/*.AppImage snap/parts/appimage-wrapper/
        APPIMAGE_FILE=$(ls snap/parts/appimage-wrapper/*.AppImage | head -n1)
        echo $APPIMAGE_FILE > snap/parts/appimage-wrapper/APPIMAGE_FILENAME.txt

    - name: Generate minimal Snapcraft.yaml
      run: |
        APPIMAGE_FILE=$(cat snap/parts/appimage-wrapper/APPIMAGE_FILENAME.txt)
        mkdir -p snap
        echo "name: simpliplay-armv7" > snap/snapcraft.yaml
        echo "version: \"2.2.0\"" >> snap/snapcraft.yaml
        echo "summary: \"ARMv7 AppImage wrapper\"" >> snap/snapcraft.yaml
        echo "description: |" >> snap/snapcraft.yaml
        echo "  This Snap wraps the ARMv7 AppImage of SimpliPlay." >> snap/snapcraft.yaml
        echo "base: core22" >> snap/snapcraft.yaml
        echo "confinement: strict" >> snap/snapcraft.yaml
        echo "architectures:" >> snap/snapcraft.yaml
        echo "  - build-on: amd64" >> snap/snapcraft.yaml
        echo "    run-on: armhf" >> snap/snapcraft.yaml
        echo "parts:" >> snap/snapcraft.yaml
        echo "  appimage-wrapper:" >> snap/snapcraft.yaml
        echo "    plugin: dump" >> snap/snapcraft.yaml
        echo "    source: parts/appimage-wrapper" >> snap/snapcraft.yaml
        echo "    override-build: |" >> snap/snapcraft.yaml
        echo "      mkdir -p \$SNAPCRAFT_PART_INSTALL" >> snap/snapcraft.yaml
        echo "      cp * \$SNAPCRAFT_PART_INSTALL/" >> snap/snapcraft.yaml
        echo "      chmod +x \$SNAPCRAFT_PART_INSTALL/*.AppImage" >> snap/snapcraft.yaml
        echo "    stage-packages: []" >> snap/snapcraft.yaml
        echo "apps:" >> snap/snapcraft.yaml
        echo "  simpliplay:" >> snap/snapcraft.yaml
        echo "    command: \$SNAP/$(basename $APPIMAGE_FILE)" >> snap/snapcraft.yaml

    - name: Build ARMv7 wrapper Snap
      run: snapcraft pack --destructive-mode
      working-directory: snap
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      with:
        name: linux-armv7-snap
        path: snap/*.snap
      continue-on-error: true
