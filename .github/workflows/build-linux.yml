  build_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use ARM64 package.json
        run: |
          mv simpliplay/package.json simpliplay/package-unused.json
          mv simpliplay/package-arm64-linux.json simpliplay/package.json

      - run: npm install
        working-directory: simpliplay

      #- name: Install Flatpak tooling
        #run: |
          #sudo apt-get update
          #sudo apt-get install -y flatpak flatpak-builder
        #continue-on-error: true

      - run: npx electron-builder --linux AppImage --arm64
        working-directory: simpliplay

      #- name: Prepare Flatpak package.json
        #run: |
          ## Save original
          #cp simpliplay/package.json simpliplay/package.json.orig
          ## Check if jq is installed; if not, install it
          #if ! command -v jq &> /dev/null
          #then
            #echo "jq not found, installing..."
            #sudo apt-get update
            #sudo apt-get install -y jq
          #fi
          ## Create patched package.json with older Electron
          #jq '.devDependencies.electron="39.0.0"' simpliplay/package.json.orig > simpliplay/package.flatpak.json
          ## Replace package.json for Flatpak build
          #mv simpliplay/package.flatpak.json simpliplay/package.json

      #- name: Create unpacked build for Flatpak
        #run: npx electron-builder --linux --arm64 --dir
        #working-directory: simpliplay

      #- name: Build Flatpak
        #run: npx electron-builder --linux flatpak --arm64
        #working-directory: simpliplay
        #continue-on-error: true

      #- name: Restore original package.json
        #run: mv simpliplay/package.json.orig simpliplay/package.json

      - run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - run: sudo snap install snapcraft --classic

      - run: sudo snap install gnome-3-28-1804

      - run: sudo snap install gtk-common-themes

      - run: sudo snap install core22

      - run: SNAPCRAFT_BUILD_ENVIRONMENT=host USE_SYSTEM_FPM=true npx electron-builder --linux snap --arm64
        working-directory: simpliplay

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-snap
          path: simpliplay/dist/*.snap

      #- uses: actions/upload-artifact@v4
        #with:
          #name: linux-arm64-flatpak
          #path: simpliplay/dist/*.flatpak
        #continue-on-error: true

  build_i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare i386 package.json
        run: |
          # Save original
          cp simpliplay/package.json simpliplay/package.json.orig
      
          # Check if jq is installed; install if missing
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      
          # Patch package.json to use Electron v3.1
          jq '.devDependencies.electron="3.1.13"' simpliplay/package.json.orig > simpliplay/package.i386.json
      
          # Replace package.json for the i386 build
          mv simpliplay/package.i386.json simpliplay/package.json
  
      - run: npm install
        working-directory: simpliplay
  
      - name: Build AppImage i386
        run: npx electron-builder --linux AppImage --ia32
        working-directory: simpliplay
  
      - uses: actions/upload-artifact@v4
        with:
          name: linux-i386-appimage
          path: simpliplay/dist/*.AppImage

  build_armv7:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QEMU for ARMv7 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          # Register ARM emulation so Snapcraft sees armhf/armv7
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
        
      - name: Install dependencies
        run: npm install
        working-directory: simpliplay
  
      - name: Build ARMv7 AppImage
        run: npx electron-builder --linux AppImage --armv7l
        working-directory: simpliplay
        continue-on-error: true
  
      - name: Upload ARMv7 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7-appimage
          path: simpliplay/dist/*.AppImage
        continue-on-error: true
  
      - name: Prepare Snap wrapper files
        run: |
          mkdir -p snap/parts/appimage
          cp simpliplay/dist/*.AppImage snap/parts/appimage/
  
      - name: Generate snapcraft.yaml (NO ARCH)
        run: |
          APPIMAGE_NAME=$(basename simpliplay/dist/*.AppImage)
          APP_VERSION=$(jq -r '.version' simpliplay/package.json)
  
          printf "name: simpliplay-armv7\n" > snap/snapcraft.yaml
          printf "version: \"%s\"\n" "$APP_VERSION" >> snap/snapcraft.yaml
          printf "summary: SimpliPlay ARMv7 AppImage wrapper\n" >> snap/snapcraft.yaml
          printf "description: SimpliPlay ARMv7 AppImage wrapped as a Snap\n" >> snap/snapcraft.yaml
          printf "base: core20\n" >> snap/snapcraft.yaml
          printf "confinement: classic\n\n" >> snap/snapcraft.yaml
  
          printf "parts:\n" >> snap/snapcraft.yaml
          printf "  appimage:\n" >> snap/snapcraft.yaml
          printf "    plugin: dump\n" >> snap/snapcraft.yaml
          printf "    source: parts/appimage\n" >> snap/snapcraft.yaml
          printf "    override-build: |\n" >> snap/snapcraft.yaml
          printf "      cp -r . \"\$SNAPCRAFT_PART_INSTALL\"\n" >> snap/snapcraft.yaml
          printf "      chmod +x \"\$SNAPCRAFT_PART_INSTALL\"/*.AppImage\n\n" >> snap/snapcraft.yaml
  
          printf "apps:\n" >> snap/snapcraft.yaml
          printf "  simpliplay:\n" >> snap/snapcraft.yaml
          printf "    command: \$SNAP/%s\n" "$APPIMAGE_NAME" >> snap/snapcraft.yaml
  
      - name: Build ARMv7 wrapper Snap
        run: snapcraft pack --destructive-mode --enable-experimental-target-arch --target-arch=armhf
        working-directory: snap
        continue-on-error: true
  
      - name: Upload ARMv7 Snap
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7-snap
          path: snap/*.snap
        continue-on-error: true
