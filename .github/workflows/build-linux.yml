        #working-directory: simpliplay
        
      #- name: Prepare Flatpak package.json
        #run: |
          ## Save original
          #cp simpliplay/package.json simpliplay/package.json.orig
          ## Check if jq is installed; if not, install it
          #if ! command -v jq &> /dev/null
          #then
            #echo "jq not found, installing..."
            #sudo apt-get update
            #sudo apt-get install -y jq
          #fi
          ## Create patched package.json with older Electron
          #jq '.devDependencies.electron="39.0.0"' simpliplay/package.json.orig > simpliplay/package.flatpak.json
          ## Replace package.json for Flatpak build
          #mv simpliplay/package.flatpak.json simpliplay/package.json

      #- name: Build Flatpak
