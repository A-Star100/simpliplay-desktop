name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/dependabot-bump.yml'
      - '.github/workflows/dependabot.yml'
      - 'README.md' #ignore readme
      - '.gitignore' #ignore the gitignore that is the file that ignores other files
  workflow_dispatch:
  workflow_call:

jobs:
  build_x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install
        working-directory: simpliplay

      - name: Build Snap and AppImage
        run: npx electron-builder --linux snap AppImage --x64
        working-directory: simpliplay

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flatpak flatpak-builder
        continue-on-error: true

      - name: Create unpacked build for Flatpak
        run: npx electron-builder --linux --x64 --dir
        working-directory: simpliplay
        
      - name: Patch package.json
        run: |
          # save OG package json
          cp simpliplay/package.json simpliplay/package.json.orig
          # Check if jq is installed; if not, install it
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          # patch the json to use select electron for compat
          jq '.devDependencies.electron="40.0.0" | .devDependencies["electron-builder"]="26.0.1"' \
              simpliplay/package.json.orig > simpliplay/package.flatpak.json
              
          # print the json to double check if jq actually worked...
          echo "electron $(jq -r '.devDependencies.electron' simpliplay/package.flatpak.json)"
          echo "electron-builder $(jq -r '.devDependencies["electron-builder"]' simpliplay/package.flatpak.json)"
          
          # replace package.json for flatpak build
          mv simpliplay/package.flatpak.json simpliplay/package.json

      - name: Build Flatpak
        run: npx electron-builder --linux flatpak --x64
        working-directory: simpliplay
        continue-on-error: true

      - name: Restore package.json
        run: mv simpliplay/package.json.orig simpliplay/package.json # redundant for now but might be useful in future

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-snap
          path: simpliplay/dist/*.snap

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64-flatpak
          path: simpliplay/dist/*.flatpak
        continue-on-error: true

  build_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use arm64 package.json instead of x64
        run: |
          mv simpliplay/package.json simpliplay/package-unused.json
          mv simpliplay/package-arm64-linux.json simpliplay/package.json

      - run: npm install
        working-directory: simpliplay

      - run: npx electron-builder --linux AppImage --arm64
        working-directory: simpliplay

      # the below is to prevent snapcraft from crashing
      # for some reason it does not cope without these deps
      # on arm64 and armv7 anyway

      - name: Update package listings and install libgdk-pixbuf
        run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - name: Install Snapcraft CLI
        run: sudo snap install snapcraft --classic

      - name: Install GNOME packages
        run: sudo snap install gnome-3-28-1804

      - name: Install GTK theme stuff
        run: sudo snap install gtk-common-themes

      - name: Install core22 snap
        run: sudo snap install core22

      - name: Build Snap
        run: SNAPCRAFT_BUILD_ENVIRONMENT=host USE_SYSTEM_FPM=true npx electron-builder --linux snap --arm64
        working-directory: simpliplay

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flatpak flatpak-builder
        continue-on-error: true

      - name: Patch package.json for Flatpak
        run: |
          # Save og
          cp simpliplay/package.json simpliplay/package.json.orig
          # Check if jq is installed; if not, install it
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          # patch the json to use select electron and electron-builder for compat
          jq '.devDependencies.electron="40.0.0" | .devDependencies["electron-builder"]="26.0.1"' \
              simpliplay/package.json.orig > simpliplay/package.flatpak.json
              
          # print the json to double check if jq actually worked...
          echo "electron $(jq -r '.devDependencies.electron' simpliplay/package.flatpak.json)"
          echo "electron-builder $(jq -r '.devDependencies["electron-builder"]' simpliplay/package.flatpak.json)"
          
          # replace package.json for flatpak build cuz electron-builder is unfortunately
          # picky regarding flatpaks
          mv simpliplay/package.flatpak.json simpliplay/package.json

      - name: Create unpacked build for Flatpak
        run: npx electron-builder --linux --arm64 --dir
        working-directory: simpliplay

      - name: Build Flatpak
        run: | 
          #echo "file struct below:"
          #ls
          
          #if ! pwd | grep -q "simpliplay"; then
            #cd simpliplay
          #fi
          if [ ! -d node_modules ]; then
            echo "node_modules wasn't found, will install deps now"
            npm install
          fi
          npx electron-builder --linux flatpak --arm64
          
        working-directory: simpliplay
        continue-on-error: true

      - name: Restore package.json
        run: mv simpliplay/package.json.orig simpliplay/package.json

      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-appimage
          path: simpliplay/dist/*.AppImage
          
      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-snap
          path: simpliplay/dist/*.snap

      - uses: actions/upload-artifact@v6
        with:
          name: linux-arm64-flatpak
          path: simpliplay/dist/*.flatpak
        continue-on-error: true

  build_i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
  
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare i386 package.json
        run: |
          # save og package.json
          cp simpliplay/package.json simpliplay/package.json.orig
      
          # is jq installed?
          if ! command -v jq &> /dev/null
          then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      
          # patch package.json to use Electron v3.1
          jq '.devDependencies.electron="3.1.13"' simpliplay/package.json.orig > simpliplay/package.i386.json
      
          # replace package.json for the i386 build
          mv simpliplay/package.i386.json simpliplay/package.json
  
      - run: npm install
        working-directory: simpliplay
  
      - name: Build AppImage i386
        run: npx electron-builder --linux AppImage --ia32
        working-directory: simpliplay
  
      - uses: actions/upload-artifact@v6
        with:
          name: linux-i386-appimage
          path: simpliplay/dist/*.AppImage

  build_armv7:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
  
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      #TODO: remove qemu emulation step cuz
      #apparently snapcraft v8 has better platforms handling

      - name: Install QEMU for ARMv7 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          # register arm emulation to fool the snapcraft cli
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Build ARMv7 AppImage
        run: npx electron-builder --linux AppImage --armv7l
        working-directory: simpliplay
  
      - name: Upload ARMv7 AppImage
        uses: actions/upload-artifact@v6
        with:
           name: linux-armv7-appimage
           path: simpliplay/dist/*.AppImage

      # the below is to prevent snapcraft from crashing
      # for some reason it does not cope without these deps
      # on arm64 and armv7 anyway

      - name: Update package listings and install libgdk-pixbuf
        run: sudo apt-get update && sudo apt-get install --only-upgrade libgdk-pixbuf-2.0-0

      - name: Install Snapcraft CLI
        run: sudo snap install snapcraft --classic

      - name: Install GNOME packages
        run: sudo snap install gnome-3-28-1804

      - name: Install GTK theme stuff
        run: sudo snap install gtk-common-themes

      - name: Install core22 snap
        run: sudo snap install core22

      - name: Build snap
        run: npx electron-builder --linux snap --armv7l
        working-directory: simpliplay
        
      - name: Upload artifacts      
        uses: actions/upload-artifact@v6
        with:
          name: linux-armv7l-v2-snap
          path: simpliplay/dist/*.snap

  build_riscv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install global deps (qemu, jq, risc-v libs and ts-node)
        run: |
          sudo apt-get update
          # the libc6-riscv64-cross package gives us the dynamic loader and base libs
          # which will definitely help
          # we just have to hope the package doesn't get damaged in shipping though
          sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support libc6-riscv64-cross
          # qemu, please register at the front desk
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true
          # ts-node, have a good flight to here
          npm install -g ts-node typescript

      - name: Install Node project deps
        run: npm install
        working-directory: simpliplay

      - name: Swap to electron-builder fork and build
        env:
          npm_config_arch: riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu/
          ELECTRON_MIRROR: "https://github.com/riscv-forks/electron-riscv-releases/releases/download/"
          ELECTRON_CUSTOM_DIR: 'v${version}' # don't try and resolve the value
          # before the job starts
          # otherwise builder will use a broken url
          # which is very very bad
          ELECTRON_CUSTOM_FILENAME: 'electron-v${version}-linux-riscv64.zip'
          # same here as well
        run: |
          # clone the repo
          echo "cloning electron-builder fork..."
          git clone https://git.spacemit.com/electron/electron-builder.git custom-builder
          
          # checkout riscv branch
          cd custom-builder
          git checkout riscv
          echo "now using branch:"
          git branch --show-current

          # patch out dmg-license
          # it's darwin-only and freaks out linux compiler
          # causing a direct halt
          # hopefully this issue gets fixed with the fork soon
          # also we check if dmg-license is the only one there
          # and delete entire dependencies key if it is
          # because in latest upstream (not fork yet) another dep
          # is in dependencies key
          # and Spacemit could always do a rebase y'know
          find . -name "package.json" -type f | while read -r file; do
            jq 'del(.dependencies["dmg-license"], .devDependencies["dmg-license"]) | 
                if .dependencies == {} then del(.dependencies) else . end | 
                if .devDependencies == {} then del(.devDependencies) else . end' \
                "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done

          rm -f yarn.lock # delete the lockfile cuz it caches way too many things
          
          # install the builder's own deps the right way
          # so we don't have to deal with symlinks
          yarn install --ignore-engines --ignore-scripts
          
          # now use the local source with npx
          echo "attempting build now..."
          export NODE_PATH=$NODE_PATH:$(pwd)/packages
          npx ts-node --transpile-only packages/electron-builder/src/cli/cli.ts \
            --project ../ \
            --linux appimage --arch riscv64      
        working-directory: simpliplay

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-riscv64-appimage
          path: simpliplay/dist/*.AppImage

