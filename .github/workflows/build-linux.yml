        #run: |
          #sudo apt-get update
          #sudo apt-get install -y flatpak flatpak-builder
        #continue-on-error: true

      - name: Build Snap + AppImage
        run: npx electron-builder --linux snap AppImage --x64
        working-directory: simpliplay
        
