name: Test on Linux

on:
  workflow_call:

jobs:
  test-linux:
    name: Test ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-latest' || 'ubuntu-22.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          LIB_ASOUND=$([[ "${{ matrix.arch }}" == "x64" ]] && echo "libasound2t64" || echo "libasound2")
          sudo apt-get install -y xvfb libgbm1 $LIB_ASOUND

      - name: Download artifact
        run: gh run download ${{ github.run_id }} --pattern "*linux*${{ matrix.arch }}*" --dir test-dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run functional test
        shell: bash
        run: |
          APPIMAGE=$(find test-dist -name "*.AppImage" | head -n 1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          
          EXECUTABLE="./squashfs-root/SimpliPlay"
          chmod +x "$EXECUTABLE"
          
          dbus-run-session -- xvfb-run --auto-servernum "$EXECUTABLE" --no-sandbox &
          APP_PID=$!
          
          sleep 10
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ app is alive. terminating..."
            kill $APP_PID
          else
            echo "❌ app crashed or closed too soon"
            exit 1
          fi

  test-armv7l:
    name: Test armhf/armv7l
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Multi-arch & QEMU
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          # Including libasound2-data helps prevent dependency conflicts
          sudo apt-get install -y qemu-user-static binfmt-support libasound2:armhf libasound2-data libgbm1:armhf xvfb

      - name: Download armv7l Artifact
        run: gh run download ${{ github.run_id }} --pattern "*linux*armv7*" --dir test-dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run functional test
        run: |
          APPIMAGE=$(find test-dist -name "*.AppImage" | head -n 1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null
          
          # Use a variable for consistency and ensure it is executable
          EXECUTABLE="./squashfs-root/SimpliPlay"
          chmod +x "$EXECUTABLE"
          
          echo "starting armhf test (10s)"
          dbus-run-session -- xvfb-run --auto-servernum "$EXECUTABLE" --no-sandbox &
          APP_PID=$!
          
          sleep 10
          
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ app is alive. terminating..."
            kill $APP_PID
          else
            echo "❌ app crashed under QEMU emulation"
            exit 1
          fi
