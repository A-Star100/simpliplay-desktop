name: Publish to Snap Store

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to release to'
        required: true
        default: 'edge'
        type: choice
        options: [edge, stable]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: snap-upload
    steps:
     # this stops git from whining (phew)
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all Snaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p final-snaps
          # pulls all the snaps
          gh run download --dir final-snaps --pattern "*-snap"

      - name: Setup Snapcraft
        run: sudo snap install snapcraft --classic
        
      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: final-snaps/**/*.snap # loop through all the snaps with... a globstar
          release: ${{ github.event.inputs.channel }} 
