name: Publish to Snap Store

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to release to'
        required: true
        default: 'edge'
        type: choice
        options: [edge, stable]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: snap-upload
    steps:
     # this stops git from whining (phew)
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all Snaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p final-snaps
          # pulls all the snaps
          gh run download --dir final-snaps --pattern "*-snap"

      - name: Publish to Snap Store
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        run: |
          # well, if no snaps are found, everything will freak out
          shopt -s globstar
          # nullglob helps this become more graceful
          
          # find every single needed .snap
          for snap_file in final-snaps/**/*.snap; do
            if [ -f "$snap_file" ]; then
              echo "Uploading: $snap_file"
              snapcraft upload "$snap_file" --release ${{ github.event.inputs.channel }} # pick edge or stable, remember that!!!
            fi
          done
