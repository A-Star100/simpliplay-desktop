name: Dependabot version bump
on:
  pull_request:
    branches: [ main ]

jobs:
  bump-version:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      main_js: "simpliplay/main.js"
      arm_json: "simpliplay/package-arm64-linux.json"
      regular_json: "simpliplay/package.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update version in main.js
        run: |
          currentversion=$(grep -oP 'let version = "\K[^"]+' ${{ env.main_js }})
          
          v1=$(echo $currentversion | cut -d. -f1); v1=${v1:-0}
          v2=$(echo $currentversion | cut -d. -f2); v2=${v2:-0}
          v3=$(echo $currentversion | cut -d. -f3); v3=${v3:-0}
          #v4=$(echo $currentversion | cut -d. -f4); v4=${v4:-0}
          
          v3=$((v3 + 1))

          #if [ "$v4" -gt 9 ]; then v4=0; v3=$((v3 + 1)); fi
          if [ "$v3" -gt 9 ]; then v3=0; v2=$((v2 + 1)); fi
          if [ "$v2" -gt 9 ]; then v2=0; v1=$((v1 + 1)); fi

          newversion="$v1.$v2.$v3.0"
          sed -i "s/let version = \"$currentversion\"/let version = \"$newversion\"/" "${{ env.main_js }}"

      - name: Update version for package.json and package-arm64-linux.json
        run: |
          currentVersion=$(grep -oP 'let version = "\K[^"]+' ${{ env.main_js }})
          newVersion=$(echo "$currentVersion" | cut -d. -f1-3)

          touch tmp-regular.json
          jq --arg newVer "$newVersion" '.version = $newVer' "${{ env.regular_json }}" > tmp-regular.json
          mv tmp-regular.json "${{ env.regular_json }}"

          touch tmp-arm64.json
          jq --arg newVer "$newVersion" '.version = $newVer' "${{ env.arm_json }}" > tmp-arm64.json
          mv tmp-arm64.json "${{ env.arm_json }}"

          rm -f tmp-regular.json
          rm -f tmp-arm64.json
          
      - name: Sync some dependencies in package-arm64-linux.json with package.json
        run: |
          electronVer=$(jq -r '.devDependencies.electron' "${{ env.regular_json }}")
          builderVer=$(jq -r '.devDependencies.["electron-builder"]' "${{ env.regular_json }}")
          
          # yeah, there are better ways to do this
          # but may as well keep it readable
          touch tmp_step_1.json
          jq --arg electronVersion "$electronVer" '.devDependencies.electron = $electronVersion' "${{ env.arm_json }}" > tmp_step_1.json

          touch tmp_step_2.json
          jq --arg builderVersion "$builderVer" '.devDependencies.["electron-builder"] = $builderVersion' "./tmp_step_1.json" > tmp_step_2.json
          mv tmp_step_2.json "${{ env.arm_json }}"

          rm -f tmp_step_1.json
          rm -f tmp_step_2.json

      # - name: Commit and push
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add .
      #     git commit -m "chore: increment version number and electron dep"
      #     git push

      - name: Commit and push
        uses: ryancyq/github-signed-commit@e9f3b28c80da7be66d24b8f501a5abe82a6b855f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: "**/*"
          commit-message: "chore: increment version number and electron dep"
