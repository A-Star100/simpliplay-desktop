name: Dependabot Version Bump
on:
  pull_request:
    branches: [ main ]

jobs:
  bump-version:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Increment version in main.js
        run: |
          filepath="simpliplay/main.js"
          currentversion=$(grep -oP 'let version = "\K[^"]+' $filepath)
          
          v1=$(echo $currentversion | cut -d. -f1); v1=${v1:-0}
          v2=$(echo $currentversion | cut -d. -f2); v2=${v2:-0}
          v3=$(echo $currentversion | cut -d. -f3); v3=${v3:-0}
          v4=$(echo $currentversion | cut -d. -f4); v4=${v4:-0}
          
          v4=$((v4 + 1))

          if [ "$v4" -gt 9 ]; then v4=0; v3=$((v3 + 1)); fi
          if [ "$v3" -gt 9 ]; then v3=0; v2=$((v2 + 1)); fi
          if [ "$v2" -gt 9 ]; then v2=0; v1=$((v1 + 1)); fi

          newversion="$v1.$v2.$v3.$v4"
          sed -i "s/let version = \"$currentversion\"/let version = \"$newversion\"/" "$filepath"

      # - name: Sync electron versions
      #   run: |
      #     NEW_ELECTRON=$(jq -r '.dependencies.electron // .devDependencies.electron' simpliplay/package.json)
      #     NEW_BUILDER=$(jq -r '.dependencies["electron-builder"] // .devDependencies["electron-builder"]' simpliplay/package.json)
          
      #     ARM_FILE="simpliplay/package-arm64-linux.json"
          
      #     if [ -f "$ARM_FILE" ] && [ "$NEW_ELECTRON" != "null" ]; then
      #       tmp=$(mktemp)
      #       jq --arg env "$NEW_ELECTRON" --arg bld "$NEW_BUILDER" \
      #          '.dependencies.electron = $env | .dependencies["electron-builder"] = $bld' \
      #          "$ARM_FILE" > "$tmp" && mv "$tmp" "$ARM_FILE"
      #       echo "synced electron ($NEW_ELECTRON) to $ARM_FILE"
      #     else
      #       echo "error: Could not find versions in package.json or $ARM_FILE is missing"
      #       exit 1
      #     fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simpliplay/main.js
          git commit -m "chore: auto-increment version in main.js for Electron update"
          git push
