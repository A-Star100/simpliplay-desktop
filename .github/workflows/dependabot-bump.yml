name: Dependabot version Bump
on:
  pull_request:
    branches: [ main ]

jobs:
  bump-version:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: increment ver in main.js
        run: |
          filepath="simpliplay/main.js"
          
          currentversion=$(grep -oP 'let version = "\K[^"]+' $filepath)
          
          v1=$(echo $currentversion | cut -d. -f1); v1=${v1:-0}
          v2=$(echo $currentversion | cut -d. -f2); v2=${v2:-0}
          v3=$(echo $currentversion | cut -d. -f3); v3=${v3:-0}
          v4=$(echo $currentversion | cut -d. -f4); v4=${v4:-0}
          
          v4=$((v4 + 1))

          fix_version_name() {
            declare -n first=$1
            declare -n second=$2
            if [ "$first" -gt 9 ]; then
               first=0
               second=$((second + 1))
            fi
          }
          fix_version_name v4 v3
          fix_version_name v3 v2
          fix_version_name v2 v1
          newversion="$v1.$v2.$v3.$v4"
          
          sed -i "s/let version = \"$currentversion\"/let version = \"$newversion\"/" "$filepath"

      - name: sync electron versions to arm64 json
        run: |
          NEW_ELECTRON=$(jq -r '.dependencies.electron' simpliplay/package.json)
          NEW_BUILDER=$(jq -r '.dependencies["electron-builder"]' simpliplay/package.json)
          
          # update only that stuff in the ARM64 json without touching other params
          ARM_FILE="package-arm64-linux.json"
          if [ -f "$ARM_FILE" ]; then
            tmp=$(mktemp)
            jq --arg env "$NEW_ELECTRON" --arg bld "$NEW_BUILDER" \
               '.dependencies.electron = $env | .dependencies["electron-builder"] = $bld' \
               "$ARM_FILE" > "$tmp" && mv "$tmp" "$ARM_FILE"
            echo "Synced Electron $NEW_ELECTRON and Builder $NEW_BUILDER to $ARM_FILE"
          fi

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          main_code="simpliplay/main.js"
          arm_manifest="simpliplay/package-arm64-linux.json"
          git add "$main_code" "$arm_manifest" --force
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-increment version and sync linux arm64 json dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "everything's up to date already"
          fi
