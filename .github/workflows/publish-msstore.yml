name: Publish to MS Store

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  publish-msstore:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove win section
        shell: bash
        run: |
          jq 'del(.build.win)' package.json > tmp.json && mv tmp.json package.json
        working-directory: simpliplay

      - name: Bump up version num
        shell: bash
        run: |
          # then have the main package.json version be one more
          # like in winget
          jq '
            .version |= (split(".") | .[-1] = (.[-1] | tonumber + 1 | tostring) | join("."))
          ' package.json > package.json.tmp
          mv package.json.tmp package.json

          # display json for debug now 
          cat package.json | jq '.'
        working-directory: simpliplay

      - name: Patch out update check
        shell: bash
        run: |
           chmod +x .github/workflows/patches/remove_update_check.sh
           .github/workflows/patches/remove_update_check.sh

      - name: Patch out DevTools
        shell: bash
        run: |
           chmod +x .github/workflows/patches/sandbox_devtools.sh
           .github/workflows/patches/sandbox_devtools.sh

      - name: Fixup syntax on line 182
        shell: bash
        run: |
          # because the other scripts removed a '}' on that line
          # yes, this is bad, but everyone starts somewhere
          sed -i '182s/$/}/' simpliplay/main.js

      - name: Show patches
        shell: bash
        run: |
          echo "note that this is a PATCHED main.js file, it can contain syntax errors. for new patches, check in a JS linter"
          echo "and then EDIT this accordingly, otherwise store build can fail to launch"
          cat simpliplay/main.js

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: simpliplay

      - name: Build appx
        shell: bash
        run: | 
          npx electron-builder --win appx --x64 --arm64
          ls dist/ # debug
          shopt -s extglob # add extendedglob
          mv dist/SimpliPlay*arm64.appx dist/SimpliPlay-arm64-msstore.appx
          mv dist/SimpliPlay!(*msstore*).appx dist/SimpliPlay-x64-msstore.appx
        working-directory: simpliplay
          
      - uses: actions/upload-artifact@v6
        with:
           name: windows-x64-appx
           path: simpliplay/dist/SimpliPlay-x64-msstore.appx
           
      - uses: actions/upload-artifact@v6
        with:
           name: windows-arm64-appx
           path: simpliplay/dist/SimpliPlay-arm64-msstore.appx

