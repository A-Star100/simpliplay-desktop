name: Publish to MS Store

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  publish-msstore:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: simpliplay

      - name: Patch for MS Store
        shell: bash
        run: |
          # get version from main.js
          # that github-actions bot did
          version=$(sed -nE "s/.*version\s*[:=]\s*['\"]([0-9.]+)['\"].*\r?/\1/p" main.js)
          echo "Version being used for buildVersion arg: $version"
          
          # then have the main package.json version be one more
          jq --arg winVer "$version" --arg storeVer "$ms_store_version" '
            .version = (.version | split(".") | .[-1] = (.[-1] | tonumber + 1 | tostring) | join(".")) |
            .build.buildVersion = $winVer |
            .build.win = {
              "target": ["appx"]
            } |
            .build.appx = {
              "version": $storeVer,
              "identityName": "AnirudhSevugan.SimpliPlay",
              "publisher": "CN=980A5BA5-E457-4289-89D8-1E46A33B1D3E",
              "publisherDisplayName": "Anirudh Sevugan",
              "displayName": "SimpliPlay (PC)"
            }
          ' package.json > package.json.tmp

          # display json for debug now 
          cat package.json | jq '.'
        working-directory: simpliplay

      - name: Build installer
        shell: bash
        run: | 
          npx electron-builder --win --x64 --arm64
          ls # debug
          mv dist/SimpliPlay-x64-*.appx dist/SimpliPlay-x64-msstore.appx
          mv dist/SimpliPlay-arm64-*.appx dist/SimpliPlay-arm64-msstore.appx
        working-directory: simpliplay

      - name: Setup bundle resources
        shell: bash
        run: |
          mkdir appxbundle
          mv *.appx appxbundle/
        working-directory: simpliplay/dist 

      - name: Compress the bundle now
        shell: pwsh
        run: |
          Compress-Archive appxbundle/* SimpliPlay_universal.appxbundle
        working-directory: simpliplay/dist 

      - uses: actions/upload-artifact@v6
        with:
           name: windows-appxbundle
           path: simpliplay/dist/*.appxbundle

      - name: Configure MS Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3
        continue-on-error: true
        
      - name: Reconfigure store credentials 
        run: |
            msstore reconfigure ` 
              --tenantId ${{ secrets.MS_TENANT_ID }} ` 
              --sellerId ${{ secrets.MS_SELLER_ID }} ` 
              --clientId ${{ secrets.MS_CLIENT_ID }} ` 
              --clientSecret ${{ secrets.MS_APPLICATION }} 
        continue-on-error: true
 
      - name: Publish Appx
        run: |
          msstore publish 'SimpliPlay_universal.appxbundle' -id [totally not lame placeholder to insert product id]
        working-directory: simpliplay/dist
        continue-on-error: true
