name: Publish to MS Store

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  publish-msstore:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove win section
        shell: bash
        run: |
          jq 'del(.build.win)' package.json > tmp.json && mv tmp.json package.json
        working-directory: simpliplay

      - name: Patch out update check
        shell: bash
        run: |
           chmod +x .github/workflows/patches/remove_update_check.sh
           .github/workflows/patches/remove_update_check.sh

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: simpliplay

      - name: Build appx
        shell: bash
        run: | 
          npx electron-builder --win appx --x64 --arm64
          ls dist/ # debug
          shopt -s extglob # add extendedglob
          mv dist/SimpliPlay*arm64.appx dist/SimpliPlay-arm64-msstore.appx
          mv dist/SimpliPlay!(*msstore*).appx dist/SimpliPlay-x64-msstore.appx
        working-directory: simpliplay

      - name: Make appxbundle
        shell: pwsh
        run: |
          # find
          $MakeAppx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\MakeAppx.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          # run
          & $MakeAppx bundle /d ./dist /p ./SimpliPlay_universal.appxbundle
        working-directory: simpliplay
          
      - uses: actions/upload-artifact@v6
        with:
           name: windows-appxbundle
           path: simpliplay/dist/SimpliPlay_universal.appxbundle

