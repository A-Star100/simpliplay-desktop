name: Publish to MS Store

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  publish-msstore:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: simpliplay

      - name: Patch main target to appx
        run: |
          jq '.build.win.target[0].target = ["appx"]' package.json
          jq '.win.target[0].target |= .[0]' package.json > tmp.json && mv tmp.json package.json
        working-directory: simpliplay

      - name: Build installer
        shell: bash
        run: | 
          npx electron-builder --win --x64 --arm64
          ls # debug
          mv dist/SimpliPlay-win-x64-*.appx dist/SimpliPlay-x64-msstore.appx
          mv dist/SimpliPlay-win-arm64-*.appx dist/SimpliPlay-arm64-msstore.appx
        working-directory: simpliplay

      - name: Setup bundle resources
        shell: bash
        run: |
          mkdir appxbundle
          mv *.appx appxbundle/
        working-directory: simpliplay/dist 

      - name: Compress the bundle now
        shell: pwsh
        run: |
          Compress-Archive appxbundle/* SimpliPlay_universal.appxbundle
        working-directory: simpliplay/dist 

      - uses: actions/upload-artifact@v6
        with:
           name: windows-appxbundle
           path: simpliplay/dist/*.appxbundle

      - name: Configure MS Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3
        continue-on-error: true
        
      - name: Reconfigure store credentials 
        run: |
            msstore reconfigure ` 
              --tenantId ${{ secrets.MS_TENANT_ID }} ` 
              --sellerId ${{ secrets.MS_SELLER_ID }} ` 
              --clientId ${{ secrets.MS_CLIENT_ID }} ` 
              --clientSecret ${{ secrets.MS_APPLICATION }} 
        continue-on-error: true
 
      - name: Publish Appx
        run: |
          msstore publish 'SimpliPlay_universal.appxbundle' -id [totally not lame placeholder to insert product id]
        working-directory: simpliplay/dist
        continue-on-error: true
