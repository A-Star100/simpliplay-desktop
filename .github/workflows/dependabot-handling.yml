name: Handle manual dep updates and dependabot PRs
on:
  pull_request:
    types: [opened]

jobs:
  close-dependabot-prs:
    if: github.event.label.name == 'manual-upgrade'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
      - name: Close dependabot PRs
        run: |
          title="${{ github.event.pull_request.title }}"

          if [[ "$title" == *"electron-builder"* ]]; then
            dep="electron-builder"
          elif [[ "$title" == *"electron"* ]]; then
            dep="electron"
          fi

          if [ ! -z "$dep" ]; then
            echo "Closing dependabot PRs for $dep"
            gh pr list --author "app/dependabot" --json number,title | \
            jq -r --arg pkg "$dep" '.[] | select(.title | test("bump " + $pkg + " from"; "i")) | .number' | \
            xargs -I {} gh pr close {} --comment "Closed because a manual dependency upgrade for $dep is in progress."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  add-version-bump-label:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
      - name: Add version-bump label
        run: gh pr edit "$PR_NUMBER" --add-label "version-bump"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
