name: Publish to Snap Store

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to release to'
        required: true
        default: 'edge'
        type: choice
        options: [edge, stable]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: snap-upload
    steps:
     # this stops git from whining (phew)
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all Snaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p final-snaps
          # pulls all the snaps
          gh run download --dir final-snaps --pattern "*-snap"

      - name: Setup Snapcraft
        run: | 
          sudo snap install snapcraft --classic --channel=latest/stable
          echo "/snap/bin" >> $GITHUB_PATH

      - name: Publish to Snap Store
        shell: bash
        env:
          SNAPCRAFT_STORE_AUTH: candid
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        run: |
          snapcraft whoami
          TARGET_CHANNEL="${{ github.event.inputs.channel }}" # in case this step becomes larger
          # i'll remember the env name

          SNAPS=$(find final-snaps -name "*.snap")
          
          if [ -z "$SNAPS" ]; then
            echo "Whoops! No .snap files were found, unfortunately... Check the yaml or the assets."
            exit 1
          fi

          for snap_file in $SNAPS; do
            echo "Uploading: $snap_file to $TARGET_CHANNEL"
            snapcraft upload "$snap_file" --release "$TARGET_CHANNEL"
          done
