name: Publish to Snap Store

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to release to'
        required: true
        default: 'edge'
        type: choice
        options: [edge, stable]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: snap-upload
    steps:
     # this stops git from whining (phew)
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all Snaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p final-snaps
          # pulls all the snaps
          gh run download --dir final-snaps --pattern "*-snap"

      - name: Setup Snapcraft
        run: sudo snap install snapcraft --classic
        
      - name: Publish to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        run: |
          # so builds DONT fail
          SNAPS=$(find final-snaps -name "*.snap")

          if [ -z "$SNAPS" ]; then
            echo "No .snap files found in final-snaps/"
            ls -R final-snaps/
            exit 1
          fi

          for snap_file in $SNAPS; do
            echo "Uploading: $snap_file"
            /snap/bin/snapcraft upload "$snap_file" --release ${{ github.event.inputs.channel }}
          done
