name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install deps
      run: |
        npm install && npm install -g playwright --save-dev && playwright install --with-deps
      working-directory: simpliplay
    - name: Run Playwright tests
      run: |
        playwright test
        # for some reason if we install anything from playwright
        # even just npm install @playwright/test
        # this step will throw an error with no tests found
        # but if we don't install anything from playwright
        # then it finds the test but says no playwright module is found
        # my guess is this is due to npx but not sure
      working-directory: simpliplay
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
      #working-directory: simpliplay
