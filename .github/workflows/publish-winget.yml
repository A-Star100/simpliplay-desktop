name: Build for winget

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  
jobs:
  build-winget:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: npm install
        working-directory: simpliplay

      - name: Patch for winget
        shell: bash
        run: |
          # this is to make sure the installer
          # doesn't need ui interaction to finish
          # as that breaks winget rules
          jq '.build.nsis += { 
            "oneClick": true, 
            "allowToChangeInstallationDirectory": false, 
            "perMachine": false, 
            "deleteAppDataOnUninstall": false 
          }' package.json > package.json.tmp
          mv package.json.tmp package.json
          # display the new json for debug
          cat package.json | jq '.'
        working-directory: simpliplay

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: | 
          npx electron-builder --win --x64 --arm64
          rm -f SimpliPlay-win-setup.exe
          mv dist/SimpliPlay-x64-win-setup.exe dist/SimpliPlay-x64-winget-setup.exe
          mv dist/SimpliPlay-arm64-win-setup.exe dist/SimpliPlay-arm64-winget-setup.exe
        working-directory: simpliplay

      - name: Create pre-release for winget build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "winget-${{ github.run_number }}"
          name: "SimpliPlay desktop (winget-${{ github.run_number }})"
          draft: false
          prerelease: true
          files: |
            simpliplay/dist/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
          
  publish-winget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # trying with a github app
      # the docs don't say it will work, but it might
      - name: Generate temp app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ secrets.WINGET_ID }}
          private-key: ${{ secrets.WINGET_TOKEN }}

      - name: Parse version num
        id: ver-num
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # query cli for version
          $tag = gh release view --json tagName --jq '.tagName'
          
          # remove extra info
          $version = $tag -replace '^release-|^v', ''
          
          # pass version
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish to Winget
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: AnirudhSevugan.SimpliPlay
          token: ${{ steps.app-token.outputs.token }}
          release-tag: winget-${{ github.run_number }}
          version: ${{ steps.ver-num.outputs.version }}
          release-notes-url: "https://github.com/A-Star100/simpliplay-desktop/releases/latest"
