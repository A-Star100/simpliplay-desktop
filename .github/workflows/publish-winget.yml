name: Build for winget

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  build-winget:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: npm install
        working-directory: simpliplay

      - name: Patch for winget
        shell: bash
        run: |
          # this is to make sure the installer
          # doesn't need ui interaction to finish
          # as that breaks winget rules
          jq '.build.nsis += { 
            "oneClick": true, 
            "allowToChangeInstallationDirectory": false, 
            "perMachine": false, 
            "deleteAppDataOnUninstall": false 
          }' package.json > package.json.tmp
          mv package.json.tmp package.json
          # display the new json for debug
          cat package.json | jq '.'
        working-directory: simpliplay

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: | 
          npx electron-builder --win --x64 --arm64
          rm -f dist/SimpliPlay-win-setup.exe
          mv dist/SimpliPlay-x64-win-setup.exe dist/SimpliPlay-x64-winget-setup.exe
          mv dist/SimpliPlay-arm64-win-setup.exe dist/SimpliPlay-arm64-winget-setup.exe
        working-directory: simpliplay

      - name: Create pre-release for winget build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "winget-${{ github.run_number }}"
          name: "SimpliPlay desktop (winget-${{ github.run_number }})"
          draft: false
          prerelease: true
          files: |
            simpliplay/dist/SimpliPlay-x64-winget-setup.exe
            simpliplay/dist/SimpliPlay-arm64-winget-setup.exe
          token: ${{ secrets.GITHUB_TOKEN }}
          
  publish-winget:
    runs-on: ubuntu-slim
    needs: build-winget
    steps:
      - name: Parse version num
        id: ver-num
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # query cli for version
          tag=$(gh release view --json tagName --jq '.tagName')
          
          # remove extra info
          version=$(echo "$tag" | sed -E 's/^release-|^v//')
          
          # pass version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Winget
        uses: vedantmgoyal9/winget-releaser@7bd472be23763def6e16bd06cc8b1cdfab0e2fd5 #v2
        with:
          identifier: AnirudhSevugan.SimpliPlay
          token: ${{ secrets.WINGET_PAT }}
          release-tag: winget-${{ github.run_number }} # release tag where winget setup exe is
          version: ${{ steps.ver-num.outputs.version }} # ver num from main release tag
          release-notes-url: https://github.com/A-Star100/simpliplay-desktop/releases/tag/release-${{ steps.ver-num.outputs.version }}
          installers-regex: '\.exe$' # only exe files

      - name: Add on-behalf-of at end of PR comment
        env:
          run-id: ${{ github.run_id }}
        run: |
          # use filters to find PR
          pr_num=$(gh pr list -R microsoft/winget-pkgs -s open -A "[anirudhsevugan-bot]" -L 1 --json number -q '.[0].number')

          # add workflow url
          workflow_url="https://github.com/A-Star100/simpliplay-desktop/actions/runs/${run-id}"
          
          # edit PR comment
          gh pr edit "$PR_NUMBER" -R microsoft/winget-pkgs --body "$(gh pr view "$pr_num" -R microsoft/winget-pkgs --json body -q '.body') *On behalf of @A-Star100 via [this CI run]($workflow_url)*"
        continue-on-error: true
