name: Build for winget

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-winget:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install deps
        run: npm install
        working-directory: simpliplay

      - name: Patch for winget
        shell: bash
        run: |
          # this is to make sure the installer
          # doesn't need ui interaction to finish
          # as that breaks winget rules
          jq '.build.nsis += { 
            "oneClick": true, 
            "allowToChangeInstallationDirectory": false, 
            "perMachine": false, 
            "deleteAppDataOnUninstall": false 
          }' package.json > package.json.tmp
          mv package.json.tmp package.json
          # display the new json for debug
          cat package.json | jq '.'
        working-directory: simpliplay

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: | 
          npx electron-builder --win --x64 --arm64
          rm -f SimpliPlay-win-setup.exe
          mv dist/SimpliPlay-x64-win-setup.exe dist/SimpliPlay-x64-winget-setup.exe
          mv dist/SimpliPlay-arm64-win-setup.exe dist/SimpliPlay-arm64-winget-setup.exe
        working-directory: simpliplay

      - name: Create pre-release for winget build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "winget-${{ github.run_number }}"
          name: "SimpliPlay desktop (winget-${{ github.run_number }})"
          draft: false
          prerelease: true
          files: |
            simpliplay/dist/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-winget:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout winget-pkgs fork
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/winget-pkgs
          path: winget-fork
          
      - name: Install Komac
        run: |
          winget install komac --accept-source-agreements --accept-package-agreements --silent --force
          echo "$env:USERPROFILE\AppData\Local\Microsoft\WinGet\Packages" >> $env:GITHUB_PATH

      - name: Run update with Komac
        working-directory: winget-fork
        run: |
          $raw_tag = gh release view --json tagName --jq '.tagName'
          $version = $raw_tag -replace '^release-', ''
          $x64_url="https://github.com/A-Star100/simpliplay-desktop/releases/download/winget-${{ github.run_number }}/SimpliPlay-x64-winget-setup.exe"
          $arm64_url="https://github.com/A-Star100/simpliplay-desktop/releases/download/winget-${{ github.run_number }}/SimpliPlay-arm64-winget-setup.exe"
          # iirc, komac works locally without token
          # and saves files
          komac update AnirudhSevugan.SimpliPlay `
            --version "$version" `
            --urls "$x64_url", "$arm64_url"
            
      - name: Push changes
        working-directory: winget-fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b simpliplay-winget-${{ github.run_number }}
          git add .
          git commit -m "Update SimpliPlay"
          git push origin simpliplay-winget-${{ github.run_number }} --force

      - name: Open PR to winget-pkgs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $raw_tag = gh release view --json tagName --jq '.tagName'
          $version = $raw_tag -replace '^release-', ''
          gh pr create `
            --repo microsoft/winget-pkgs `
            --base master `
            --head "${{ github.repository_owner }}:simpliplay-winget-${{ github.run_number }}" `
            --title "New version: AnirudhSevugan.SimpliPlay version $version" `
            --body "Automated from a CI run :D" `
            --error-if-exists
