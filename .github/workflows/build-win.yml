name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/dependabot-bump.yml'
      - '.github/workflows/dependabot.yml'
      - 'README.md'             # Ignore documentation
      - '.gitignore'            # Ignore git settings

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Build Windows (x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64
        working-directory: simpliplay

      - name: Upload artifacts (x64)
        uses: actions/upload-artifact@v4
        with:
          name: builds-x64
          path: simpliplay/dist/

  build-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Build Windows (arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --arm64
        working-directory: simpliplay

      - name: Upload artifacts (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: builds-arm64
          path: simpliplay/dist/

  test-windows-x64:
    name: Test Windows x64
    needs: build-x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download x64 artifact
        shell: bash
        run: gh run download ${{ github.run_id }} --pattern "builds-x64" --dir test-dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run functional test
        shell: bash
        run: |
          EXE_PATH=$(find test-dist -ipath "*unpacked/*.exe" ! -iname "*setup*" ! -iname "*update*" | head -n 1)

          if [ -z "$EXE_PATH" ]; then
            echo "unpacked binary not found, searching general dist..."
            EXE_PATH=$(find test-dist -name "*.exe" ! -iname "*setup*" ! -iname "*update*" | head -n 1)
          fi
          
          if [ -z "$EXE_PATH" ]; then
            echo "❌ no binary was found"
            exit 1
          fi

          echo "Testing binary at: $EXE_PATH"
          
          # Use the full path for PowerShell
          FULL_PATH=$(realpath "$EXE_PATH")
          
          powershell -Command "& {
            \$p = Start-Process '$FULL_PATH' -PassThru -ArgumentList '--no-sandbox';
            Start-Sleep -Seconds 10;
            if (\$p -and !\$p.HasExited) {
              Write-Host '✅ app is alive. now terminating...';
              Stop-Process -Id \$p.Id -Force;
              exit 0
            } else {
              Write-Error '❌ app crashed or closed too soon';
              exit 1
            }
          }"

  test-windows-arm64:
    name: Test Windows arm64
    needs: build-arm64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download arm64 artifact
        shell: bash
        run: gh run download ${{ github.run_id }} --pattern "builds-arm64" --dir test-dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run functional test
        shell: bash
        run: |
          EXE_PATH=$(find test-dist -ipath "*unpacked/*.exe" ! -iname "*setup*" ! -iname "*update*" | head -n 1)

          if [ -z "$EXE_PATH" ]; then
            echo "unpacked binary not found, searching general dist..."
            EXE_PATH=$(find test-dist -name "*.exe" ! -iname "*setup*" ! -iname "*update*" | head -n 1)
          fi
          
          if [ -z "$EXE_PATH" ]; then
            echo "❌ no binary was found"
            exit 1
          fi

          echo "Testing binary at: $EXE_PATH"
          
          # Use the full path for PowerShell
          FULL_PATH=$(realpath "$EXE_PATH")
          
          powershell -Command "& {
            \$p = Start-Process '$FULL_PATH' -PassThru -ArgumentList '--no-sandbox';
            Start-Sleep -Seconds 10;
            if (\$p -and !\$p.HasExited) {
              Write-Host '✅ app is alive. now terminating...';
              Stop-Process -Id \$p.Id -Force;
              exit 0
            } else {
              Write-Error '❌ app crashed or closed too soon';
              exit 1
            }
          }"
