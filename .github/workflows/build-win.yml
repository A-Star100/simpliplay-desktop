name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-universal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
        working-directory: simpliplay
      - name: Build Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64 --arm64
        working-directory: simpliplay
      - name: Upload builds
        uses: actions/upload-artifact@v6
        with:
          name: windows-universal
          path: simpliplay/dist/
