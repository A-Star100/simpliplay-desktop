name: Draft Release
on:
  workflow_dispatch:
    inputs:
        release_notes:
          description: "Anything's changed? The release notes are in Markdown btw."
          required: false
          default: "Just a regular release. Not too many changes :D"
  workflow_call:

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # fetches all the history instead of just
          # one commit by default
          fetch-depth: 0 

      - name: Prepare folder(s)
        run: mkdir -p all-artifacts

      - name: Get latest successful runs
        id: built-successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # use gh api to get the run and pipe it to output env so other steps can access it
          echo "run_id=$(gh run list --status success --limit 1 --json databaseId --jq '.[0].databaseId')" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.build-info.outputs.built-successfully }}
          path: all-artifacts

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # fetch from GH api
          if gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="draft-${{ github.run_number }}" --jq .body > raw.md
          then
            # filter notes only for comparisons
            grep -v "github.com/.*/compare/" raw.md > draft.md
          else
            # fall back to git log in case gh api is down
            # instead of failing fast on ci
            echo "WARNING: using git log for notes because GH api seems like it's down"
            git log -n 10 --format="- %s" > draft.md
          fi

          # create and pipe md
          {
            echo "## Release Notes"
            echo "${{ inputs.release_notes }}"
            echo ""
            cat draft.md
          } > "${{ github.workspace }}/CHANGELOG.md"

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "draft-${{ github.run_number }}"
          name: "Release draft-${{ github.run_number }}"
          draft: true
          body_path: CHANGELOG.md
          files: |
            all-artifacts/**/*.exe
            all-artifacts/**/*.dmg
            all-artifacts/**/*.flatpak
            all-artifacts/**/*.AppImage
          token: ${{ secrets.GITHUB_TOKEN }}
