name: Draft Release
on:
  workflow_dispatch:
    inputs:
        release_notes:
          description: "Anything's changed? The release notes are in Markdown btw."
          required: false
          default: "Just a regular release. Not too many changes :D"
  workflow_call:

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # fetches all the history instead of just
          # one commit by default
          fetch-depth: 0 

      - name: Prepare folder(s)
        run: mkdir -p all-artifacts

      - name: Get run IDs
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "windows=$(gh run list --workflow "build-win.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId')" >> $GITHUB_OUTPUT
          echo "macos=$(gh run list --workflow "build-macos.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId')" >> $GITHUB_OUTPUT
          echo "linux=$(gh run list --workflow "build-linux.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId')" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        if: steps.builds.outputs.windows != 'null'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.builds.outputs.windows }}
          path: all-artifacts

      - name: Download macOS artifacts
        if: steps.builds.outputs.macos != 'null'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.builds.outputs.macos }}
          path: all-artifacts

      - name: Download Linux artifacts
        if: steps.builds.outputs.linux != 'null'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.builds.outputs.linux }}
          path: all-artifacts

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          #TODO: get gh api working
          git log -n 10 --format="- %s" > raw.md

          # get comparison urls
          grep -v "github.com/.*/compare/" raw.md > draft.md || true

          # pipe into changelog md for release step
          # to take over
          {
            echo "## Release Notes"
            echo "${{ inputs.release_notes }}"
            echo ""
            cat draft.md
          } > "${{ github.workspace }}/CHANGELOG.md"

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "draft-${{ github.run_number }}"
          name: "Release draft-${{ github.run_number }}"
          draft: true
          body_path: CHANGELOG.md
          files: |
            all-artifacts/**/*.exe
            all-artifacts/**/*.dmg
            all-artifacts/**/*.flatpak
            all-artifacts/**/*.AppImage
          token: ${{ secrets.GITHUB_TOKEN }}
