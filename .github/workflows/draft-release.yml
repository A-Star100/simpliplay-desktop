name: Draft Release

on:
  workflow_dispatch:

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare folder
        run: mkdir -p all-artifacts

      - name: Download all artifacts from latest workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⬇️ Downloading all artifacts from latest workflow run..."
          LATEST_RUN_ID=$(gh run list -L 1 --json databaseId --jq '.[0].databaseId')
          gh run download $LATEST_RUN_ID --dir all-artifacts

      - name: Extract ZIP files
        run: |
          echo "📦 Extracting any ZIP files..."
          find all-artifacts -type f -name '*.zip' | while read -r zipfile; do
            extract_dir="${zipfile%.zip}"
            unzip -o "$zipfile" -d "$extract_dir"
          done

      - name: Collect files to upload
        run: |
          echo "🔍 Collecting SimpliPlay binaries..."
          rm -f upload-files.txt
          find all-artifacts -type f \( -iname '*.exe' -o -iname '*.dmg' -o -iname '*.AppImage' -o -iname '*.snap' \) | grep 'SimpliPlay' > upload-files.txt
          echo "Files to upload:"
          cat upload-files.txt

      - name: Create empty draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "draft-${{ github.run_number }}"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize filenames and handle duplicates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          sanitize() {
            echo "$1" | tr ' ' '-'
          }

          release_tag="draft-${{ github.run_number }}"
          mkdir -p all-artifacts-final
          rm -f upload-files-final.txt

          # Fetch existing assets on the release
          existing_assets=$(gh release view "$release_tag" --json assets --jq '.assets[].name' || echo "")

          while IFS= read -r filepath; do
            filename=$(basename "$filepath")
            dirname=$(basename "$(dirname "$filepath")")
            safe_filename=$(sanitize "$filename")

            # If duplicate exists, append directory name to distinguish
            if echo "$existing_assets" | grep -qx "$safe_filename"; then
              extension="${filename##*.}"
              name="${filename%.*}"
              safe_name=$(sanitize "$name")
              new_filename="${safe_name}-${dirname}.${extension}"
              cp "$filepath" "all-artifacts-final/$new_filename"
              echo "all-artifacts-final/$new_filename" >> upload-files-final.txt
            else
              # Rename if necessary, else keep original
              if [[ "$filename" != "$safe_filename" ]]; then
                cp "$filepath" "all-artifacts-final/$safe_filename"
                echo "all-artifacts-final/$safe_filename" >> upload-files-final.txt
              else
                cp "$filepath" "all-artifacts-final/$filename"
                echo "all-artifacts-final/$filename" >> upload-files-final.txt
              fi
            fi
          done < upload-files.txt

          echo "Final list of files to upload:"
          cat upload-files-final.txt

      - name: Upload assets to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          release_tag="draft-${{ github.run_number }}"
          while IFS= read -r filepath; do
            echo "Uploading $filepath"
            gh release upload "$release_tag" "$filepath" --clobber
          done < upload-files-final.txt
