name: Release

on:
  workflow_dispatch:
    inputs:
      snap_channel:
        description: 'Snap Store release channel'
        required: true
        default: 'edge'
        type: choice
        options: [edge, stable, beta, canary]

jobs:
  build-linux:
    uses: ./.github/workflows/build_linux.yml

  build-macos:
    uses: ./.github/workflows/build_macos.yml

  build-windows:
    uses: ./.github/workflows/build_windows.yml

  publish-snap:
    needs: [build-linux]
    uses: ./.github/workflows/publish_snap.yml
    with:
      channel: ${{ github.event.inputs.snap_channel}}
    secrets: inherit

  playwright-test:
    uses: ./.github/workflows/playwright.yml

  draft-release:
    needs: [build-linux, build-macos, build-windows, playwright-test]
    permissions:
      contents: write
    uses: ./.github/workflows/draft_release.yml
    secrets: inherit
