name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/dependabot-bump.yml'
      - '.github/workflows/dependabot.yml'
      - 'README.md' # ignore readme changes
      - '.gitignore' # ignore gitignore changes

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean up caches
        run: |
          npm cache clean --force
          rm -rf ~/Library/Caches/electron-builder
        working-directory: simpliplay

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Create DMGs
        run: npx electron-builder --mac --x64 --arm64 --universal
        working-directory: simpliplay

      - name: Upload production-ready builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          # upload just the DMGs
          path: simpliplay/dist/*.dmg

      - name: Prepare Test Archive
        run: |
          # ditto to preserve all that mac metadata stuff
          cd simpliplay/dist
          # zip the app into an uncomfy backpack
          find . -name "SimpliPlay.app" -exec ditto -c -k --sequesterRsrc --keepParent "{}" test-app.zip \;

      - name: Upload testing binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: simpliplay/dist/test-app.zip
      
  test:
      runs-on: macos-latest
      needs: [build]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
      
        - name: Download test binaries
          uses: actions/download-artifact@v4
          with:
            name: test-artifacts
            path: test-dist/
        - name: Run launch test
          run: |
            find test-dist -name "SimpliPlay.app" -type d | while read -r APP_PATH; do
              BIN="$APP_PATH/Contents/MacOS/SimpliPlay"
            
              echo "launching $BIN"
            
              "$BIN" --no-sandbox &
              PID=$!
            
              sleep 15
            
              if kill -0 "$PID" 2>/dev/null; then
                echo "app is alive. terminating..."
                kill "$PID"
              else
                echo "app crashed or closed too soon"
                exit 1
              fi
            done


