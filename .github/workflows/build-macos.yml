name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/dependabot-bump.yml'
      - '.github/workflows/dependabot.yml'
      - 'README.md'             # Ignore documentation
      - '.gitignore'            # Ignore git settings

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean up caches
        run: |
          npm cache clean --force
          rm -rf ~/Library/Caches/electron-builder
        working-directory: simpliplay

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Create DMGs
        run: npx electron-builder --mac --x64 --arm64 --universal
        working-directory: simpliplay

      - name: Upload production-ready builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          # upload just the DMGs
          path: simpliplay/dist/*.dmg

      - name: Prepare Test Archive
        run: |
          # Using ditto ensures macOS-specific metadata and symlinks are preserved
          cd simpliplay/dist
          # This finds the app and zips it into a single file
          find . -name "*.app" -exec ditto -c -k --sequesterRsrc --keepParent "{}" test-app.zip \;

      - name: Upload testing binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: simpliplay/dist/test-app.zip
      
  test:
      runs-on: macos-latest
      needs: [build]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
      
        - name: Download test binaries
          uses: actions/download-artifact@v4
          with:
            name: test-artifacts
            path: test-dist/
        - name: Run functional test
          run: |
            find test-dist -name "*.app" -type d | while read -r APP_PATH; do
              EXECUTABLE="$APP_PATH/Contents/MacOS/SimpliPlay"
              
              if [ -f "$EXECUTABLE" ]; then
                chmod +x "$EXECUTABLE"
                echo "testing $EXECUTABLE"
                
                "$EXECUTABLE" --no-sandbox &
                APP_PID=$!
                
                sleep 10
                
                if kill -0 $APP_PID 2>/dev/null; then
                  echo "✅ app is alive. terminating..."
                  kill -9 $APP_PID
                else
                  echo "❌ app crashed or closed too soon"
                  exit 1
                fi
              else
                echo "⚠️ Found .app at $APP_PATH but no binary at $EXECUTABLE"
              fi
            done
