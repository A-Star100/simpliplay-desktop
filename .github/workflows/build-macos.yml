name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/dependabot-bump.yml'
      - '.github/workflows/dependabot.yml'
      - 'README.md'             # Ignore documentation
      - '.gitignore'            # Ignore git settings

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean up caches
        run: |
          npm cache clean --force
          rm -rf ~/Library/Caches/electron-builder
        working-directory: simpliplay

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Create DMGs
        run: npx electron-builder --mac --x64 --arm64 --universal
        working-directory: simpliplay

      - name: Upload production-ready builds
        uses: actions/upload-artifact@v4
        with:
          name: builds
          # upload just the DMGs
          path: simpliplay/dist/*.dmg

      - name: Upload testing binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          # globstar to find any .app in any subdir
          path: simpliplay/dist/**/*.app

  test:
     runs-on: macos-latest
     needs: [build]
     steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Download test binaries
          uses: actions/download-artifact@v4
          with:
            name: test-artifacts
            path: test-dist/
        - name: Run functional test
          run: |
            # get all those app paths
            apps=($(find test-dist -name "*.app" -type d))

            for APP_PATH in "${apps[@]}"; do
              echo "Testing: $APP_PATH"
            
              # get those permissions ready
              chmod -R +x "$APP_PATH"
              
              # run the app for 10 seconds
              EXECUTABLE=$(find "$APP_PATH/Contents/MacOS" -type f -maxdepth 1 | head -n 1)
            
              timeout 10s "$EXECUTABLE" || echo "Testing completed (duration: 10 seconds)"
            done
        
