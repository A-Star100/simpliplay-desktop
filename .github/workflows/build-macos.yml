name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: simpliplay

      - name: Build and package macOS app
        run: npx electron-builder --mac --x64 --arm64
        working-directory: simpliplay
      
      - name: Force ad-hoc signing
        run: |
          # The path to your packaged .app file
          APP_PATH="dist/mac/SimpliPlay.app"
          
          # Use the native codesign tool to apply an ad-hoc signature
          codesign --force --deep --sign - "$APP_PATH"
          codesign --force --deep --sign - "dist/mac-arm64/SimpliPlay.app"
        working-directory: simpliplay

      - name: Build universal macOS app
        run: npx electron-builder --mac --universal
        working-directory: simpliplay
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: simpliplay/dist/*.dmg
