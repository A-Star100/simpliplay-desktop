name: Build for winget

on:
  workflow_call:
  workflow_dispatch:
  
jobs:
  build-winget:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: simpliplay

      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: | 
          npx electron-builder --win --x64 --arm64
          rm -f dist/SimpliPlay-win-setup.exe
          mv dist/SimpliPlay-x64-win-setup.exe dist/SimpliPlay-x64-winget-setup.exe
          mv dist/SimpliPlay-arm64-win-setup.exe dist/SimpliPlay-arm64-winget-setup.exe
        working-directory: simpliplay

      - name: Parse version num
        shell: bash
        id: ver-num-first
        run: |
          # search from main.js
          version=$(awk -F"['\"]" '/let version/ {print $2}' main.js)
          
          # fail if it wasn't found
          if [ -z "$version" ]; then
            echo "error: could not find version in main.js" >&2
            exit 1
          fi
          
          # if not failed, pass out to next job
          echo "version=$version" >> "$GITHUB_OUTPUT"
        working-directory: simpliplay

      # if the release fails, try setting draft to true
      # and DISABLE publish-winget in release yml (by removing it)
      - name: Create pre-release for winget build
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 #3.0.2
        with:
          tag_name: "winget-${{ github.run_number }}" # for compat
          name: "SimpliPlay desktop (winget-${{ steps.ver-num-first.outputs.version }})"
          draft: true
          prerelease: false
          files: |
            simpliplay/dist/SimpliPlay-x64-winget-setup.exe
            simpliplay/dist/SimpliPlay-arm64-winget-setup.exe
          token: ${{ secrets.GITHUB_TOKEN }}
